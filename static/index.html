<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acorn</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1d1b16;--mute:#6f6a5e;--line:#e6e1d6;--accent:#b4571b;--accent-2:#2f6f4f;--bad:#a23b3b;--soft:#f3efe6}
@media (prefers-color-scheme:dark){:root{--bg:#16140f;--card:#1f1c16;--ink:#f1ede3;--mute:#a39d8e;--line:#34301f;--accent:#e08a4f;--accent-2:#6fc59a;--bad:#e07a7a;--soft:#27231a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}h1 span{color:var(--accent)}header small{color:var(--mute)}.sp{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent)}button.p{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{opacity:.5;cursor:wait}
main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;padding:18px 20px;max-width:1280px;margin:0 auto}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
textarea,input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
.row{display:flex;gap:8px}.row>*{flex:1}
.item{border-top:1px solid var(--line);padding:10px 0}.item:first-of-type{border-top:0}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--mute);margin-right:6px}
.tag.acted{color:var(--accent-2)}.tag.ignored{color:var(--bad)}
.item b{display:block}.meta{color:var(--mute);font-size:12px}.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.acts button{padding:3px 9px;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.cmp{grid-template-columns:1fr}}
.col{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.col.mem{border-color:var(--accent-2)}.col h3{margin:0 0 6px;font-size:13px}.col.mem h3{color:var(--accent-2)}.col.no h3{color:var(--mute)}
.ans{white-space:pre-wrap}.facts{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.fact{font-size:12.5px;color:var(--mute);padding:3px 0}.fact i{color:var(--accent);font-style:normal;margin-right:6px}
.hint{color:var(--mute);font-size:13px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{font-size:12.5px;padding:3px 9px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;max-width:90vw}
</style>
</head>
<body>
<header>
  <h1>Acorn<span>.</span></h1><small>remembers what you save, learns what you actually do</small>
  <div class="sp"></div>
  <button id="load">Load 5-week demo history</button>
</header>
<main>
  <section>
    <div class="card" style="margin-bottom:14px">
      <h2>Save something</h2>
      <textarea id="text" rows="3" placeholder="Paste a link, note, voice transcript, or text from a screenshot"></textarea>
      <div class="row"><input id="title" placeholder="Title (optional)"><select id="kind"><option>job</option><option>recipe</option><option>article</option><option>product</option><option>idea</option><option>document</option><option selected>other</option></select></div>
      <input id="why" placeholder="Why are you saving it? (optional)">
      <button class="p" id="save">Save</button>
    </div>
    <div class="card"><h2>Inbox</h2><div id="items" class="hint">Loading…</div></div>
  </section>
  <section class="card">
    <div class="tabs"><button data-t="today" class="on">Today</button><button data-t="ask">Ask · with vs without memory</button></div>
    <div id="today"><button class="p" id="runToday">What deserves my attention today?</button><div id="todayOut" class="ans" style="margin-top:12px"></div></div>
    <div id="ask" hidden>
      <input id="q" placeholder="Ask anything about what you've saved…">
      <div class="chips" id="chips"></div>
      <button class="p" id="runAsk">Ask both</button>
      <div class="cmp" id="cmp" style="margin-top:12px"></div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/^#{1,6}\s*(.+)$/gm,'<b>$1</b>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^\s*[*-]\s+/gm,'• ');
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)};
async function api(p,o){const r=await fetch(p,o&&{method:o.method||'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o.body||{})});if(!r.ok)throw new Error((await r.text()).slice(0,200));return r.json()}
const busy=async(b,fn)=>{b.disabled=true;try{return await fn()}catch(e){toast('Error: '+e.message)}finally{b.disabled=false}};
const ago=iso=>{const d=Math.round((Date.now()-new Date(iso))/864e5);return d<=0?'today':d+'d ago'};
const facts=fs=>fs&&fs.length?`<div class="facts"><div class="meta">Hindsight memories this answer is based on (${fs.length})</div>${fs.slice(0,8).map(f=>`<div class="fact"><i>${esc(f.type||'fact')}</i>${esc(f.text)}</div>`).join('')}</div>`:'';

async function loadItems(){
  const items=await api('/api/items');
  $('#items').innerHTML=items.length?items.map(i=>`<div class="item"><span class="tag">${esc(i.kind)}</span><span class="tag ${i.status}">${i.status}</span><span class="meta">saved ${ago(i.saved_at)}</span>
    <b>${esc(i.title)}</b>${i.why?`<div class="meta">why: ${esc(i.why)}</div>`:''}
    <div class="acts">${i.status==='open'?`<button data-a="acted" data-id="${i.id}">I acted on it</button><button data-a="ignored" data-id="${i.id}">Ignoring it</button>`:''}<button data-a="brief" data-id="${i.id}">Brief me</button></div>
    <div id="brief-${i.id}" class="ans"></div></div>`).join(''):'<span class="hint">Empty. Save something, or load the demo history.</span>';
}
$('#items').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;const id=b.dataset.id,a=b.dataset.a;
  if(a==='brief')return busy(b,async()=>{const r=await api('/api/items/'+id+'/brief');$('#brief-'+id).innerHTML=`<div class="col mem" style="margin-top:8px">${md(r.text)}${facts(r.facts)}</div>`});
  await busy(b,async()=>{await api('/api/items/'+id+'/resolve',{body:{status:a}});toast('Remembered: you '+a+' it. Acorn will weigh this next time.');loadItems()});
});
$('#save').onclick=e=>busy(e.target,async()=>{
  await api('/api/items',{body:{kind:$('#kind').value,title:$('#title').value,text:$('#text').value,why:$('#why').value}});
  ['#text','#title','#why'].forEach(s=>$(s).value='');toast('Saved and retained in Hindsight.');loadItems()});
$('#load').onclick=e=>busy(e.target,async()=>{toast('Retaining 5 weeks of history… this can take a minute.');const r=await api('/api/demo/load',{});toast('Retained '+r.retained+' memories.');loadItems()});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$('#today').hidden=b.dataset.t!=='today';$('#ask').hidden=b.dataset.t!=='ask'});
$('#runToday').onclick=e=>busy(e.target,async()=>{const r=await api('/api/today');$('#todayOut').innerHTML=md(r.text)+facts(r.facts)});
const samples=["Should I apply to the Hexagon Pay job or skip it?","Which of my saved recipes will I actually cook?","Should I buy the vertical mouse?","What do I usually do with long articles I save?"];
$('#chips').innerHTML=samples.map(s=>`<button>${esc(s)}</button>`).join('');
$('#chips').onclick=e=>{if(e.target.tagName==='BUTTON')$('#q').value=e.target.textContent};
$('#runAsk').onclick=e=>busy(e.target,async()=>{const r=await api('/api/ask',{body:{question:$('#q').value}});
  $('#cmp').innerHTML=`<div class="col no"><h3>Without memory</h3><div class="ans">${md(r.without_memory)}</div></div><div class="col mem"><h3>With Hindsight memory</h3><div class="ans">${md(r.with_memory.text)}</div>${facts(r.with_memory.facts)}</div>`});
loadItems().catch(e=>toast('Backend error: '+e.message));
</script>
</body>
</html>
