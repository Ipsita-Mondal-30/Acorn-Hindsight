<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acorn</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/common.css">
</head>
<body>
<header>
  <div class="brand"><span id="logo" class="bob"></span><h1>ACORN<span>.</span></h1></div>
  <div class="tag-line">follow-through memory for work: leads, applications, reading, contracts. It learns what you actually do.</div>
  <div class="sp"></div>
  <div class="lens"><a class="btn on" href="/">FOLLOW-THROUGH</a><a class="btn" href="/pager">PAGER MEMORY</a></div>
  <button class="p" id="load">LOAD DEMO DATA</button>
  <span class="deco twinkle" id="d1" style="left:46%;top:8px"></span>
  <span class="deco twinkle" id="d2" style="right:250px;top:60px;animation-delay:.6s"></span>
</header>

<main>
  <div class="stack">
    <section class="win">
      <div class="bar"><i class="dot r"></i><i class="dot"></i><i class="dot"></i><span class="pf">save_something.exe</span></div>
      <div class="body">
        <label class="pf">WHAT IS IT?</label>
        <textarea id="text" rows="3" placeholder="Paste a link, note, voice transcript, or text from a screenshot"></textarea>
        <div class="row"><div><label class="pf">TITLE</label><input id="title" placeholder="optional"></div>
        <div><label class="pf">TYPE</label><select id="kind"><option>job</option><option>recipe</option><option>article</option><option>product</option><option>idea</option><option>document</option><option selected>other</option></select></div></div>
        <label class="pf">WHY SAVE IT?</label>
        <input id="why" placeholder="optional, but helps memory">
        <button class="p" id="save">SAVE</button>
      </div>
    </section>
    <section class="win">
      <div class="bar"><i class="dot r"></i><i class="dot"></i><i class="dot"></i><span class="pf">inbox/</span></div>
      <div class="body"><div id="items" class="hint">Loading…</div></div>
    </section>
  </div>

  <section class="win green">
    <div class="bar"><i class="dot r"></i><i class="dot"></i><i class="dot"></i><span class="pf">acorn_assistant.app</span></div>
    <div class="body">
      <div class="score" id="score"></div>
      <div class="tabs"><button data-t="today" class="on">TODAY</button><button data-t="ask">ASK · MEMORY VS NONE</button></div>
      <div id="today"><button class="p" id="runToday">WHAT NEEDS ME TODAY?</button><div id="todayOut" class="ans out"></div></div>
      <div id="ask" hidden>
        <div class="hint try pf">TRY IT: ASK &rarr; MARK AN ITEM ACTED / IGNORED &rarr; ASK AGAIN. WATCH THE ANSWER CHANGE.</div>
        <input id="q" placeholder="Ask anything about what you've saved…">
        <div class="chips" id="chips"></div>
        <button class="p" id="runAsk">ASK BOTH</button>
        <div class="cmp" id="cmp"></div>
      </div>
    </div>
  </section>
</main>

<div id="loading"><div class="pf">LOADING</div><div class="lbar"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
<div id="toast"></div>

<script src="/static/common.js"></script>
<script>
const ghostHtml=i=>{const p=i.prediction;if(!p)return '';
  const guess=`<span class="chip gp">GHOST: ${p.label.toUpperCase()} ${p.confidence}%</span>`;
  const res=i.correct===true?'<span class="chip right">GHOST WAS RIGHT</span>':i.correct===false?'<span class="chip wrong">GHOST WAS WRONG</span>':'';
  return `<div class="ghost">${guess}${res}<div class="meta">${esc(p.reason)}</div></div>`};
async function refreshGhost(){
  const g=await api('/api/ghost');const on=g.accuracy==null?0:Math.round(g.accuracy/10);
  $('#score').innerHTML=`<span class="bob">${px('ghost',4)}</span><div><div class="pf">GHOST SCORE</div>
    ${g.accuracy==null?`<div class="meta" style="margin-top:4px">${g.pending?g.pending+' guess'+(g.pending>1?'es':'')+' waiting. Now act on items.':'No guesses yet. It guesses what you will do, then checks itself.'}</div>`
    :`<div class="sbar" style="margin-top:6px">${Array.from({length:10},(_,k)=>`<i class="${k<on?'on':''}"></i>`).join('')}</div>`}</div>
    ${g.accuracy==null?'':`<div class="big">${g.right}/${g.graded} RIGHT</div><div class="meta">${g.accuracy}% accurate${g.pending?' · '+g.pending+' pending':''}</div>`}
    <div class="sp"></div><button class="p" id="guessAll" ${guessLabel?'disabled':''}>${guessLabel||'GHOST-GUESS ALL OPEN'}</button>`;
  $('#guessAll').onclick=guessAll}
let guessLabel='';
async function guessAll(){if(guessLabel)return;
  try{const items=(await api('/api/items')).filter(i=>i.status==='open'&&!i.prediction);
    if(!items.length)toast('Every open item already has a ghost guess.');
    for(const [n,i] of items.entries()){guessLabel=`GUESSING ${n+1}/${items.length}`;refreshGhost().catch(()=>{});
      try{await api('/api/items/'+i.id+'/predict',{body:{}});await loadItems()}catch(e){toast('Ghost skipped one: '+e.message,true)}}
  }finally{guessLabel='';refreshGhost().catch(()=>{})}}
async function loadItems(){
  const items=await api('/api/items');
  $('#items').innerHTML=items.length?items.map(i=>`<div class="item"><div>${px('folder',3)}</div><div>
    <div class="t">${esc(i.title)}</div>
    <div><span class="chip">${esc(i.kind)}</span><span class="chip ${i.status}">${i.status}</span><span class="meta">saved ${ago(i.saved_at)}</span></div>
    ${i.why?`<div class="meta">why: ${esc(i.why)}</div>`:''}${ghostHtml(i)}
    <div class="acts">${i.status==='open'?`${i.prediction?'':`<button class="sm" data-a="predict" data-id="${i.id}">Ghost guess</button>`}<button class="sm ok" data-a="acted" data-id="${i.id}">I acted on it</button><button class="sm no" data-a="ignored" data-id="${i.id}">Ignoring it</button>`:''}<button class="sm" data-a="brief" data-id="${i.id}">Brief me</button></div>
    <div id="brief-${i.id}"></div></div></div>`).join(''):`<div class="hint" style="text-align:center;padding:10px">${px('flower',5)}<br>Empty. Save something, or load the demo data.</div>`;
  refreshGhost().catch(()=>{});
}
$('#items').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;const id=b.dataset.id,a=b.dataset.a;
  if(a==='predict')return busy(b,async()=>{await api('/api/items/'+id+'/predict',{body:{}});loadItems()});
  if(a==='brief')return busy(b,async()=>{const r=await api('/api/items/'+id+'/brief');$('#brief-'+id).innerHTML=`<div style="margin-top:10px">${winHtml('green','brief.txt',`<div class="ans">${md(r.text)}</div>${facts(r.facts)}`)}</div>`});
  await busy(b,async()=>{const r=await api('/api/items/'+id+'/resolve',{body:{status:a}});const p=r.prediction;
    toast(p?`Ghost guessed ${p.label} (${p.confidence}%). You ${a==='acted'?'acted':'ignored'} it. Ghost was ${r.correct?'RIGHT':'WRONG'}, and it remembers.`:'Remembered: you '+a+' it. Acorn weighs this next time.',p&&!r.correct);loadItems()});
});
$('#save').onclick=e=>busy(e.target,async()=>{
  await api('/api/items',{body:{kind:$('#kind').value,title:$('#title').value,text:$('#text').value,why:$('#why').value}});
  ['#text','#title','#why'].forEach(s=>$(s).value='');toast('Saved and retained in Hindsight.');loadItems()});
$('#load').onclick=e=>busy(e.target,async()=>{toast('Retaining 5 weeks of history. Hang tight…');const r=await api('/api/demo/load',{});toast('Retained '+r.retained+' memories.');loadItems()});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$('#today').hidden=b.dataset.t!=='today';$('#ask').hidden=b.dataset.t!=='ask'});
$('#runToday').onclick=e=>busy(e.target,async()=>{const r=await api('/api/today');$('#todayOut').innerHTML=md(r.text)+facts(r.facts)});
const samples=["Should I apply to the Hexagon Pay job or skip it?","Which saved articles will I actually read?","Which of my open deadlines am I most likely to miss?","Should I buy the vertical mouse?"];
$('#chips').innerHTML=samples.map(s=>`<button class="sm">${esc(s)}</button>`).join('');
$('#chips').onclick=e=>{if(e.target.tagName==='BUTTON')$('#q').value=e.target.textContent};
const prevAsk={};
$('#runAsk').onclick=e=>busy(e.target,async()=>{const q=$('#q').value;const key=q.trim().toLowerCase();const before=prevAsk[key];
  const r=await api('/api/ask',{body:{question:q}});
  const mins=before?Math.max(1,Math.round((Date.now()-before.t)/60000)):0;
  $('#cmp').innerHTML=
   (before?`<div class="wide">${winHtml('','earlier_answer.txt',`<div class="head">${px('sparkle',4)}<span class="pf">SAME QUESTION, ${mins} MIN AGO</span></div><div class="ans">${md(before.text)}</div>`)}</div>`:'')+
   winHtml('bad','no_memory.app',`<div class="head">${px('hex',3)}<span class="pf">NO MEMORY</span></div><div class="ans">${md(r.without_memory)}</div>`)+
   winHtml('green','hindsight.app',`<div class="head">${px('coin',4)}<span class="pf">${before?'AFTER WHAT YOU DID SINCE':'WITH HINDSIGHT'}</span></div><div class="ans">${md(r.with_memory.text)}</div>${facts(r.with_memory.facts)}`);
  prevAsk[key]={text:r.with_memory.text,t:Date.now()}});
loadItems().catch(e=>toast('Backend error: '+e.message,true));
</script>
</body>
</html>
